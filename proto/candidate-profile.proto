syntax = "proto3";

package rolefit.candidateprofile.v1;

// Internal API of the Candidate Profile Service.
//
// Other RoleFit services (e.g. Job Discovery) use this API to read candidate
// data. They must NEVER connect to the Candidate Profile PostgreSQL database
// directly. This service owns that data.
service CandidateProfileService {
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse);
}

message GetProfileRequest {
  string candidate_id = 1;
}

message GetProfileResponse {
  CandidateProfile profile = 1;
}

message CandidateProfile {
  string candidate_id = 1;
  string status = 2;

  // TODO 16: Add the fields other services need (think about what Job
  // Discovery needs for matching). Expose only what they need, not
  // necessarily every column. Never renumber or reuse field numbers once
  // other services depend on them.
}
